[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redactx"
version = "0.2.0"
description = "RedactX: PHI/PII detection and redaction with a fine-tuned VaultGemma model and Presidio"
readme = "README.md"
authors = [{ name = "RedactX Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
# Production server: Presidio for hybrid mode (also needs `python -m spacy download en_core_web_lg`).
production = [
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "httpx>=0.25",
]
# Training, calibration and held-out validation.
train = [
    "datasets>=2.18",
    "accelerate>=0.27",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
]

[project.scripts]
redactx = "redactx.cli:main"

[tool.setuptools.packages.find]
include = ["redactx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
