  <text x="90" y="34" font-size="20" font-weight="700" fill="#1e293b">Receiver Operating Characteristic (ROC) Curve</text>  <text x="90" y="54" font-size="13" fill="#64748b">RedactX-v3 Discrimination Capacity Across Clinical Decision Boundaries</text>  <line x1="90.0" y1="70" x2="90.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="90.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.0</text>  <line x1="90" y1="520.0" x2="740" y2="520.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="524.0" font-size="12" fill="#475569" text-anchor="end">0.0</text>  <line x1="155.0" y1="70" x2="155.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="155.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.1</text>  <line x1="90" y1="475.0" x2="740" y2="475.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="479.0" font-size="12" fill="#475569" text-anchor="end">0.1</text>  <line x1="220.0" y1="70" x2="220.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="220.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.2</text>  <line x1="90" y1="430.0" x2="740" y2="430.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="434.0" font-size="12" fill="#475569" text-anchor="end">0.2</text>  <line x1="285.0" y1="70" x2="285.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="285.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.3</text>  <line x1="90" y1="385.0" x2="740" y2="385.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="389.0" font-size="12" fill="#475569" text-anchor="end">0.3</text>  <line x1="350.0" y1="70" x2="350.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="350.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.4</text>  <line x1="90" y1="340.0" x2="740" y2="340.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="344.0" font-size="12" fill="#475569" text-anchor="end">0.4</text>  <line x1="415.0" y1="70" x2="415.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="415.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.5</text>  <line x1="90" y1="295.0" x2="740" y2="295.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="299.0" font-size="12" fill="#475569" text-anchor="end">0.5</text>  <line x1="480.0" y1="70" x2="480.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="480.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.6</text>  <line x1="90" y1="250.0" x2="740" y2="250.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="254.0" font-size="12" fill="#475569" text-anchor="end">0.6</text>  <line x1="545.0" y1="70" x2="545.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="545.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.7</text>  <line x1="90" y1="205.00000000000003" x2="740" y2="205.00000000000003" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="209.00000000000003" font-size="12" fill="#475569" text-anchor="end">0.7</text>  <line x1="610.0" y1="70" x2="610.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="610.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.8</text>  <line x1="90" y1="160.0" x2="740" y2="160.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="164.0" font-size="12" fill="#475569" text-anchor="end">0.8</text>  <line x1="675.0" y1="70" x2="675.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="675.0" y="542" font-size="12" fill="#475569" text-anchor="middle">0.9</text>  <line x1="90" y1="115.0" x2="740" y2="115.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="119.0" font-size="12" fill="#475569" text-anchor="end">0.9</text>  <line x1="740.0" y1="70" x2="740.0" y2="520" stroke="#e2e8f0" stroke-width="1" />  <text x="740.0" y="542" font-size="12" fill="#475569" text-anchor="middle">1.0</text>  <line x1="90" y1="70.0" x2="740" y2="70.0" stroke="#e2e8f0" stroke-width="1" />  <text x="78" y="74.0" font-size="12" fill="#475569" text-anchor="end">1.0</text>  <line x1="90" y1="520" x2="740" y2="520" stroke="#334155" stroke-width="2" />  <line x1="90" y1="70" x2="90" y2="520" stroke="#334155" stroke-width="2" />  <text x="415.0" y="574" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">False Positive Rate (1 - Specificity)</text>  <text transform="rotate(-90 35 295.0)" x="35" y="295.0" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">True Positive Rate (Sensitivity / Recall)</text>  <path d="M 90.0,520.0 L 740.0,70.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" />  <path d="M 90.0,520.0 L 90.65,92.50000000000003 L 93.25,79.0 L 99.75,74.5 L 112.75,71.8 L 199.85000000000002,70.45 L 350.0,70.0 L 740.0,70.0" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" />  <circle cx="199.98" cy="71.8" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />  <text x="211.98" y="89.8" font-size="11" font-weight="700" fill="#dc2626">Mode A (TPR=0.996, FPR=0.169)</text>  <circle cx="112.75" cy="77.2" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />  <text x="124.75" y="65.2" font-size="11" font-weight="700" fill="#2563eb">Mode B (TPR=0.984, FPR=0.035)</text>  <rect x="470" y="410" width="250" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)" />  <line x1="485" y1="435" x2="515" y2="435" stroke="#7c3aed" stroke-width="3" />  <text x="525" y="439" font-size="12" font-weight="600" fill="#1e293b">RedactX-v3 (AUROC = 0.9998)</text>  <line x1="485" y1="460" x2="515" y2="460" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" />  <text x="525" y="464" font-size="12" fill="#64748b">Chance Baseline (AUROC = 0.5000)</text>  <circle cx="500" cy="483" r="5" fill="#dc2626" />  <text x="525" y="487" font-size="12" fill="#dc2626">Certified Mode A Operating Cutoff</text></svg>
