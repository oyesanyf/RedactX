  <text x="160" y="34" font-size="20" font-weight="700" fill="#1e293b">Per-Category HIPAA Safe Harbor Recall</text>  <text x="160" y="54" font-size="13" fill="#64748b">Held-Out Evaluation Across 259 Authentically Annotated Clinical Records (n2c2 2014)</text>  <line x1="160.0" y1="70" x2="160.0" y2="500" stroke="#e2e8f0" stroke-width="1" />  <text x="160.0" y="520" font-size="12" fill="#475569" text-anchor="middle">0%</text>  <line x1="302.0" y1="70" x2="302.0" y2="500" stroke="#e2e8f0" stroke-width="1" />  <text x="302.0" y="520" font-size="12" fill="#475569" text-anchor="middle">20%</text>  <line x1="444.0" y1="70" x2="444.0" y2="500" stroke="#e2e8f0" stroke-width="1" />  <text x="444.0" y="520" font-size="12" fill="#475569" text-anchor="middle">40%</text>  <line x1="586.0" y1="70" x2="586.0" y2="500" stroke="#e2e8f0" stroke-width="1" />  <text x="586.0" y="520" font-size="12" fill="#475569" text-anchor="middle">60%</text>  <line x1="728.0" y1="70" x2="728.0" y2="500" stroke="#e2e8f0" stroke-width="1" />  <text x="728.0" y="520" font-size="12" fill="#475569" text-anchor="middle">80%</text>  <line x1="870.0" y1="70" x2="870.0" y2="500" stroke="#e2e8f0" stroke-width="1" />  <text x="870.0" y="520" font-size="12" fill="#475569" text-anchor="middle">100%</text>  <line x1="160" y1="500" x2="870" y2="500" stroke="#334155" stroke-width="2" />  <line x1="160" y1="70" x2="160" y2="500" stroke="#334155" stroke-width="2" />  <text x="146" y="100.875" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Overall HIPAA</text>  <rect x="160" y="77.675" width="704.888" height="17.2" rx="4" fill="#2563eb" filter="url(#shadow)" />  <text x="872.888" y="90.875" font-size="11" font-weight="700" fill="#1e40af">99.3%</text>  <rect x="160" y="98.875" width="491.10699999999997" height="17.2" rx="4" fill="#f43f5e" opacity="0.9" />  <text x="659.107" y="112.075" font-size="11" font-weight="600" fill="#9f1239">69.2%</text>  <text x="146" y="154.625" font-size="13" font-weight="500" fill="#334155" text-anchor="end">Medical Record (MRN)</text>  <rect x="160" y="131.425" width="710.0" height="17.2" rx="4" fill="#2563eb" filter="url(#shadow)" />  <text x="878.0" y="144.625" font-size="11" font-weight="700" fill="#1e40af">100.0%</text>  <rect x="160" y="152.625" width="155.632" height="17.2" rx="4" fill="#f43f5e" opacity="0.9" />  <text x="323.632" y="165.825" font-size="11" font-weight="600" fill="#9f1239">21.9%</text>  <text x="146" y="208.375" font-size="13" font-weight="500" fill="#334155" text-anchor="end">Telephone / Contact</text>  <rect x="160" y="185.175" width="710.0" height="17.2" rx="4" fill="#2563eb" filter="url(#shadow)" />  <text x="878.0" y="198.375" font-size="11" font-weight="700" fill="#1e40af">100.0%</text>  <rect x="160" y="206.375" width="320.849" height="17.2" rx="4" fill="#f43f5e" opacity="0.9" />  <text x="488.849" y="219.575" font-size="11" font-weight="600" fill="#9f1239">45.2%</text>  <text x="146" y="262.125" font-size="13" font-weight="500" fill="#334155" text-anchor="end">Location / Geographic</text>  <rect x="160" y="238.925" width="710.0" height="17.2" rx="4" fill="#2563eb" filter="url(#shadow)" />  <text x="878.0" y="252.125" font-size="11" font-weight="700" fill="#1e40af">100.0%</text>  <rect x="160" y="260.125" width="405.40999999999997" height="17.2" rx="4" fill="#f43f5e" opacity="0.9" />  <text x="573.41" y="273.325" font-size="11" font-weight="600" fill="#9f1239">57.1%</text>  <text x="146" y="315.875" font-size="13" font-weight="500" fill="#334155" text-anchor="end">Date / Timestamp</text>  <rect x="160" y="292.675" width="703.042" height="17.2" rx="4" fill="#2563eb" filter="url(#shadow)" />  <text x="871.042" y="305.875" font-size="11" font-weight="700" fill="#1e40af">99.0%</text>  <rect x="160" y="313.875" width="535.553" height="17.2" rx="4" fill="#f43f5e" opacity="0.9" />  <text x="703.553" y="327.075" font-size="11" font-weight="600" fill="#9f1239">75.4%</text>  <text x="146" y="369.625" font-size="13" font-weight="500" fill="#334155" text-anchor="end">Patient Name</text>  <rect x="160" y="346.425" width="701.693" height="17.2" rx="4" fill="#2563eb" filter="url(#shadow)" />  <text x="869.693" y="359.625" font-size="11" font-weight="700" fill="#1e40af">98.8%</text>  <rect x="160" y="367.625" width="616.635" height="17.2" rx="4" fill="#f43f5e" opacity="0.9" />  <text x="784.635" y="380.825" font-size="11" font-weight="600" fill="#9f1239">86.9%</text>  <text x="146" y="423.375" font-size="13" font-weight="500" fill="#334155" text-anchor="end">Age (>89 Safe Harbor)</text>  <rect x="160" y="400.175" width="686.357" height="17.2" rx="4" fill="#2563eb" filter="url(#shadow)" />  <text x="854.357" y="413.375" font-size="11" font-weight="700" fill="#1e40af">96.7%</text>  <rect x="160" y="421.375" width="475.132" height="17.2" rx="4" fill="#f43f5e" opacity="0.9" />  <text x="643.1320000000001" y="434.575" font-size="11" font-weight="600" fill="#9f1239">66.9%</text>  <text x="146" y="477.125" font-size="13" font-weight="500" fill="#334155" text-anchor="end">Organization</text>  <rect x="160" y="453.925" width="679.399" height="17.2" rx="4" fill="#2563eb" filter="url(#shadow)" />  <text x="847.399" y="467.125" font-size="11" font-weight="700" fill="#1e40af">95.7%</text>  <rect x="160" y="475.125" width="113.245" height="17.2" rx="4" fill="#f43f5e" opacity="0.9" />  <text x="281.245" y="488.325" font-size="11" font-weight="600" fill="#9f1239">16.0%</text>  <rect x="610" y="420" width="250" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)" />  <rect x="625" y="435" width="24" height="14" rx="3" fill="#2563eb" />  <text x="658" y="447" font-size="12" font-weight="700" fill="#1e293b">RedactX-v3 (Ours)</text>  <rect x="625" y="460" width="24" height="14" rx="3" fill="#f43f5e" />  <text x="658" y="472" font-size="12" font-weight="600" fill="#1e293b">Microsoft Presidio</text></svg>
