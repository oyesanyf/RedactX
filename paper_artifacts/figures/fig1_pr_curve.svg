48b">Threshold: 0.0093 | Precision: 78.6%</text>  <line x1="685.176" y1="151.16500000000002" x2="755.176" y2="158.16500000000002" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2" />  <circle cx="749.28" cy="94.30000000000003" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow)" />  <rect x="529.28" y="112.30000000000003" width="205" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)" />  <text x="539.28" y="130.3" font-size="12" font-weight="700" fill="#2563eb">Mode B: Balanced Utility</text>  <text x="539.28" y="146.3" font-size="11" fill="#1e293b">Recall: 98.4% | Precision: 94.6%</text>  <text x="539.28" y="162.3" font-size="11" fill="#64748b">Threshold: 0.50 | Specificity: 96.5%</text>  <line x1="639.28" y1="112.30000000000003" x2="749.28" y2="102.30000000000003" stroke="#2563eb" stroke-width="1" stroke-dasharray="2,2" />  <rect x="547.439" y="267.265" width="12" height="12" fill="#d97706" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />  <rect x="383.43899999999996" y="213.265" width="160" height="50" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)" />  <text x="393.43899999999996" y="231.265" font-size="12" font-weight="700" fill="#d97706">Microsoft Presidio</text>  <text x="393.43899999999996" y="247.265" font-size="11" fill="#1e293b">Recall: 69.2% | Precision: 54.8%</text>  <line x1="463.43899999999996" y1="263.265" x2="553.439" y2="267.265" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2" />  <rect x="115" y="385" width="260" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)" />  <line x1="130" y1="407" x2="160" y2="407" stroke="#2563eb" stroke-width="3" />  <text x="170" y="411" font-size="12" font-weight="600" fill="#1e293b">RedactX-v3 (AUPRC = 0.9847)</text>  <line x1="130" y1="429" x2="160" y2="429" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" />  <text x="170" y="433" font-size="12