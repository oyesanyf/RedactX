[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redactx"
version = "0.1.0"
description = "RedactX: Differentially Private, Sub-50ms Jev-Like Decision Engine for PHI/PII Detection"
readme = "README.md"
authors = [{ name = "RedactX Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0"
]

[project.scripts]
redactx = "redactx.cli:main"

[tool.setuptools.packages.find]
include = ["redactx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
